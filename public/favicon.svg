<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="#234b2c"/>

  <!-- Pole -->
  <rect x="47.8" y="10" width="4.4" height="76" rx="2.2" fill="#fff"/>

  <!-- Hood ring (top) -->
  <ellipse cx="50" cy="28" rx="22" ry="5.5" fill="none" stroke="#fff" stroke-width="3.8"/>

  <!-- Chains (semi-transparent white lines from hood to basket) -->
  <g opacity="0.80" stroke="#fff" stroke-width="2.1" stroke-linecap="round">
    <line x1="34" y1="33" x2="33" y2="54"/>
    <line x1="41" y1="32" x2="40" y2="54"/>
    <line x1="50" y1="33" x2="50" y2="54"/>
    <line x1="59" y1="32" x2="60" y2="54"/>
    <line x1="66" y1="33" x2="67" y2="54"/>
  </g>

  <!-- Basket top ring -->
  <ellipse cx="50" cy="56" rx="21" ry="5.2" fill="none" stroke="#fff" stroke-width="3.8"/>

  <!-- Basket sides -->
  <line x1="29" y1="56" x2="32.5" y2="71" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="71" y1="56" x2="67.5" y2="71" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Basket bottom ring -->
  <ellipse cx="50" cy="71" rx="17.5" ry="4.2" fill="none" stroke="#fff" stroke-width="2.6"/>
</svg>
